name: Judge agreement

# Re-scores the human-labeled golden set whenever something that can change the
# judge's scores changes, and fails if agreement with the human labels drops.
on:
  pull_request:
    paths:
      - "backend/judge/**"
      - "backend/evals/**"
      - "backend/golden/**"
  push:
    branches: [main]
    paths:
      - "backend/judge/**"
      - "backend/evals/**"
      - "backend/golden/**"
  workflow_dispatch:

concurrency:
  group: judge-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agreement:
    name: Judge vs human labels
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Check for the API key secret
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Add an ANTHROPIC_API_KEY repository secret to run the judge agreement check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # judge outputs are cached by a hash of the judge code, rubric, session and model,
      # so only what changed is re-scored
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: backend/golden/cache
          key: judge-${{ hashFiles('backend/judge/**', 'backend/golden/sessions/**') }}
          restore-keys: judge-

      - name: Score the golden set and apply the gate
        if: steps.key.outputs.present == 'true'
        run: python -m evals.run_eval --gate

      - name: Add the report to the run summary
        if: always() && steps.key.outputs.present == 'true'
        run: test -f golden/REPORT.md && cat golden/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: judge-agreement-report
          path: |
            backend/golden/REPORT.md
            backend/golden/report.json
